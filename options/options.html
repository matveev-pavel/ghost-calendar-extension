<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="optionsTitle">Ghost Calendar - Settings</title>
  <style>
    :root {
      --bg-primary: #fff;
      --bg-secondary: #f9fafb;
      --text-primary: #15171a;
      --text-secondary: #738a94;
      --text-muted: #a0a0a0;
      --border: #e6e6e6;
      --border-hover: #a0a0a0;
      --accent: #30cf43;
      --btn-bg: #15171a;
      --btn-bg-hover: #394047;
      --btn-text: #fff;
      --danger: #c53030;
      --success-bg: #f0fdf0;
      --success-text: #1a7f37;
      --success-border: #d4f7d6;
      --error-bg: #fff5f5;
      --error-text: #c53030;
      --error-border: #fed7d7;
      --loading-bg: #f9fafb;
      --loading-text: #738a94;
      --loading-border: #e6e6e6;
    }

    [data-theme="dark"] {
      --bg-primary: #1e1e1e;
      --bg-secondary: #161616;
      --text-primary: #e5e5e5;
      --text-secondary: #999;
      --text-muted: #666;
      --border: #333;
      --border-hover: #555;
      --accent: #30cf43;
      --btn-bg: #333;
      --btn-bg-hover: #444;
      --btn-text: #e5e5e5;
      --danger: #f87171;
      --success-bg: #1a2e1a;
      --success-text: #4ade80;
      --success-border: #2d4a2d;
      --error-bg: #2e1a1a;
      --error-text: #f87171;
      --error-border: #4a2d2d;
      --loading-bg: #2a2a2a;
      --loading-text: #999;
      --loading-border: #333;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-primary: #1e1e1e;
        --bg-secondary: #161616;
        --text-primary: #e5e5e5;
        --text-secondary: #999;
        --text-muted: #666;
        --border: #333;
        --border-hover: #555;
        --accent: #30cf43;
        --btn-bg: #333;
        --btn-bg-hover: #444;
        --btn-text: #e5e5e5;
        --danger: #f87171;
        --success-bg: #1a2e1a;
        --success-text: #4ade80;
        --success-border: #2d4a2d;
        --error-bg: #2e1a1a;
        --error-text: #f87171;
        --error-border: #4a2d2d;
        --loading-bg: #2a2a2a;
        --loading-text: #999;
        --loading-border: #333;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: var(--bg-secondary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: var(--bg-primary);
      border-radius: 5px;
      box-shadow: 0 0 1px rgba(0, 0, 0, 0.12), 0 1px 6px rgba(0, 0, 0, 0.03), 0 6px 10px -8px rgba(0, 0, 0, 0.1);
      padding: 32px 40px;
      width: 100%;
      max-width: 480px;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header h1 {
      color: var(--text-primary);
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .header p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg-primary);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus {
      outline: none;
      border-color: var(--border-hover);
      box-shadow: none;
    }

    input::placeholder {
      color: var(--text-muted);
    }

    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 14px;
      color: var(--text-primary);
      background: var(--bg-primary);
      cursor: pointer;
      transition: border-color 0.15s;
    }

    select:focus {
      outline: none;
      border-color: var(--border-hover);
    }

    .hint {
      margin-top: 6px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .hint a {
      color: var(--accent);
      text-decoration: none;
    }

    .hint a:hover {
      text-decoration: underline;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }

    button {
      flex: 1;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--btn-bg);
      color: var(--btn-text);
    }

    .btn-primary:hover {
      background: var(--btn-bg-hover);
    }

    .btn-secondary {
      background: var(--bg-primary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--border-hover);
    }

    .status {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 13px;
      display: none;
    }

    .status.success {
      display: block;
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }

    .status.error {
      display: block;
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid var(--error-border);
    }

    .status.loading {
      display: block;
      background: var(--loading-bg);
      color: var(--loading-text);
      border: 1px solid var(--loading-border);
    }

    .section-divider {
      height: 1px;
      background: var(--border);
      margin: 28px 0;
    }

    .section-title {
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .form-row {
      display: flex;
      gap: 16px;
    }

    .form-group.half {
      flex: 1;
    }

    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-primary);
      background: var(--bg-primary);
      resize: vertical;
      transition: border-color 0.15s;
    }

    textarea:focus {
      outline: none;
      border-color: var(--border-hover);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 data-i18n="appTitle">Ghost Calendar</h1>
      <p data-i18n="optionsSubtitle">Configure connection to your Ghost blog</p>
    </div>

    <form id="settings-form">
      <div class="form-group">
        <label for="language" data-i18n="labelLanguage">Language</label>
        <select id="language">
          <option value="">🌐 Auto (Browser)</option>
          <option value="en">🇺🇸 English</option>
          <option value="es">🇪🇸 Español</option>
          <option value="zh_CN">🇨🇳 简体中文</option>
          <option value="pt_BR">🇧🇷 Português</option>
          <option value="ru">🇷🇺 Русский</option>
          <option value="de">🇩🇪 Deutsch</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="ja">🇯🇵 日本語</option>
          <option value="ko">🇰🇷 한국어</option>
          <option value="it">🇮🇹 Italiano</option>
        </select>
      </div>

      <div class="form-group">
        <label for="theme" data-i18n="labelTheme">Theme</label>
        <select id="theme">
          <option value="" data-i18n="themeAuto">Auto (System)</option>
          <option value="light" data-i18n="themeLight">Light</option>
          <option value="dark" data-i18n="themeDark">Dark</option>
        </select>
      </div>

      <div class="form-group">
        <label for="blog-url" data-i18n="labelBlogUrl">Blog URL</label>
        <input
          type="url"
          id="blog-url"
          data-i18n-placeholder="placeholderBlogUrl"
          placeholder="https://blog.example.com"
          required
        >
        <p class="hint" data-i18n="hintBlogUrl">Full URL of your Ghost blog</p>
      </div>

      <div class="form-group">
        <label for="api-key" data-i18n="labelApiKey">Admin API Key</label>
        <input
          type="password"
          id="api-key"
          data-i18n-placeholder="placeholderApiKey"
          placeholder="xxxxxxxxxxxxxxxxxxxxxxxx:yyyyyyyyyyyyyyyyyyyyyyyy"
          required
        >
        <p class="hint">
          <span data-i18n="hintApiKey">Find in Ghost Admin: Settings → Integrations →</span>
          <a href="#" id="open-integrations" data-i18n="hintApiKeyLink">Add custom integration</a>
        </p>
      </div>

      <!-- AI Settings Section -->
      <div class="section-divider"></div>
      <h2 class="section-title" data-i18n="aiSettingsTitle">AI Settings (OpenRouter)</h2>

      <div class="form-group">
        <label for="openrouter-key" data-i18n="labelOpenRouterKey">OpenRouter API Key</label>
        <input
          type="password"
          id="openrouter-key"
          data-i18n-placeholder="placeholderOpenRouterKey"
          placeholder="sk-or-v1-..."
        >
        <p class="hint">
          <span data-i18n="hintOpenRouterKey">Get your key at</span>
          <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a>
        </p>
      </div>

      <div class="form-row">
        <div class="form-group half">
          <label for="model-filter" data-i18n="labelModelFilter">Model Filter</label>
          <select id="model-filter">
            <option value="recommended" data-i18n="filterRecommended">Recommended</option>
            <option value="free" data-i18n="filterFree">Free</option>
            <option value="all" data-i18n="filterAll">All</option>
          </select>
        </div>
        <div class="form-group half">
          <label for="openrouter-model" data-i18n="labelModel">Model</label>
          <select id="openrouter-model">
            <option value="">Loading...</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="generation-language" data-i18n="labelGenerationLanguage">Generation Language</label>
        <select id="generation-language">
          <option value="English">English</option>
          <option value="Spanish">Español</option>
          <option value="Portuguese">Português</option>
          <option value="Russian">Русский</option>
          <option value="German">Deutsch</option>
          <option value="French">Français</option>
          <option value="Chinese">中文</option>
          <option value="Japanese">日本語</option>
          <option value="Korean">한국어</option>
          <option value="Italian">Italiano</option>
        </select>
      </div>

      <div class="form-group">
        <label for="custom-prompt" data-i18n="labelCustomPrompt">Custom Prompt (optional)</label>
        <textarea
          id="custom-prompt"
          rows="2"
          data-i18n-placeholder="placeholderCustomPrompt"
          placeholder="Additional instructions for AI generation..."
        ></textarea>
        <p class="hint" data-i18n="hintCustomPrompt">Adjust tone and style of generated descriptions</p>
      </div>

      <div class="buttons">
        <button type="button" class="btn-secondary" id="test-btn" data-i18n="btnTest">Test</button>
        <button type="submit" class="btn-primary" data-i18n="btnSave">Save</button>
      </div>

      <div class="status" id="status"></div>
    </form>
  </div>

  <script src="../lib/analytics.js"></script>
  <script src="../lib/i18n.js"></script>
  <script src="../lib/openrouter.js"></script>
  <script src="options.js"></script>
</body>
</html>
